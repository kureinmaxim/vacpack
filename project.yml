name: Vacpack

options:
  bundleIdPrefix: xyz.kurein
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local builds are ad-hoc signed; Developer ID signing arrives in stage 13.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  CompressorKit:
    path: Packages/CompressorKit

targets:
  Vacpack:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: CompressorKit
        product: CompressorKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Vacpack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/Resources/Vacpack.entitlements
      properties:
        # No App Sandbox: external tools and arbitrary folders (ARCHITECTURE D6).
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.kurein.vacpack
        PRODUCT_NAME: Vacpack
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  VacpackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: Vacpack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.kurein.vacpack.tests
        GENERATE_INFOPLIST_FILE: YES

  VacpackUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: Vacpack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.kurein.vacpack.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Vacpack

schemes:
  Vacpack:
    build:
      targets:
        Vacpack: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VacpackTests
        - VacpackUITests
